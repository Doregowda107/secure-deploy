
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: "5050"
      ATLAS_URI: mongodb://mongo:27017/
    expose:
      - "5050"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mongo_data: